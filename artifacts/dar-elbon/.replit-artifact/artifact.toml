kind = "web"
previewPath = "/"
title = "DAR ELBON — دار البن"
description = "موقع عربي باتجاه RTL لكافيه ومحمصة دار البن، يعرض المنيو ومعلومات الفروع ويتيح طلب البن عبر واتساب."
version = "1.0.0"
id = "artifacts/dar-elbon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20672

[services.development]
run = "pnpm --filter @workspace/dar-elbon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dar-elbon", "run", "build" ]
serve = "static"
publicDir = "artifacts/dar-elbon/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20672"
BASE_PATH = "/"
